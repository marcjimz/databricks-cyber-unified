# ============================================================================
# Cyber360 Unified Dashboard -- Databricks Asset Bundle
# ============================================================================
# Native, declarative data plane -- NO imperative scripts. Everything the
# dashboard needs is a DAB resource:
#
#   postgres_projects     -> Lakebase autoscaling project (managed Postgres) that
#                            serves KPI reads + app state. Auto-creates a
#                            `production` branch and a `primary` RW endpoint.
#   postgres_branches     -> the project's `production` branch (replace_existing)
#   postgres_endpoints    -> the project's `primary` RW endpoint (replace_existing)
#   postgres_databases    -> the logical Postgres database the app connects to
#   schemas / volumes     -> UC landing zone for OCSF gold + demo CSVs
#   pipelines             -> Lakeflow Declarative Pipeline (config-driven by
#                            cyber360.yaml): builds gold tables + daily/rolling
#                            aggregate tables
#   resources/metricviews -> UC Metric View definitions (.sql), each its own
#                            DAB-managed asset, applied by the data-plane job's
#                            sql_task steps against the SQL warehouse
#   postgres_synced_tables-> native reverse-ETL (UC aggregate -> Lakebase)
#   apps                  -> the FastAPI + React dashboard
#
# All workspace-specific values flow as DAB variables -> app.yaml env ->
# ${VAR} placeholders resolved in cyber360.yaml at startup. Never hardcode.
#
# NOTE on Genie: the current Databricks CLI does not expose a `genie_spaces`
# bundle resource, so Genie Spaces are referenced by embed URL (passed as the
# genie_*_embed_url variables). Create/curate the spaces in the workspace and
# point the variables at them; swapping a space stays a config edit.
# ============================================================================

bundle:
  name: cyber360-dashboard

variables:
  catalog:
    description: "Unity Catalog catalog for Cyber360 gold data, metric views and aggregates"
    default: "cyber360"
  schema:
    description: "Unity Catalog schema for Cyber360 tables, metric views and aggregates"
    default: "posture"
  warehouse_id:
    description: "SQL Warehouse ID -- used by Genie interactive drawer ONLY, never KPI reads"
    default: ""
  lakebase_project:
    description: "Lakebase autoscaling project id that serves KPI reads + app state (1-63 chars, lowercase/digits/hyphens)"
    default: "cyber360-lakebase"
  lakebase_branch:
    description: "Lakebase branch id -- the project's auto-created production branch"
    default: "production"
  lakebase_endpoint:
    description: "Lakebase endpoint id -- the project's auto-created primary read-write endpoint"
    default: "primary"
  # ── App connection target (branch/endpoint the APP connects to) ──
  # These default to the managed production branch/endpoint above, so the normal
  # path is unchanged. For an ISOLATED FEATURE deploy, a paired Lakebase branch is
  # forked from production out-of-band (see .github/scripts/lakebase_branch.py),
  # then the app is deployed with `--var app_connect_branch=<feature-branch-id>
  # --var app_connect_endpoint=<feature-endpoint-id>` so it connects to the forked
  # branch's own data + endpoint. The managed postgres_* resources still manage
  # production only; these vars ONLY steer the app's connection target + binding.
  app_connect_branch:
    description: "Lakebase branch id the APP connects to (defaults to the production branch)."
    default: "production"
  app_connect_endpoint:
    description: "Lakebase endpoint id the APP connects to (defaults to the primary endpoint)."
    default: "primary"
  lakebase_min_cu:
    description: "Lakebase endpoint autoscaling floor in Compute Units (min 0.5)"
    default: 0.5
  lakebase_max_cu:
    description: "Lakebase endpoint autoscaling ceiling in Compute Units"
    default: 2
  lakebase_database:
    description: "Logical Postgres database name inside the Lakebase project (lowercase/digits/underscores)"
    default: "cyber360"
  lakebase_owner_role:
    description: >-
      Postgres role id that OWNS the app database. Lakebase auto-creates one
      role per Databricks identity (dots in the email localpart become hyphens),
      e.g. marcin.jimenez@databricks.com -> `marcin-jimenez`. Set this to the
      deploying identity's role id; it is combined with the branch path to form
      the full projects/<p>/branches/<b>/roles/<role_id> owner reference.
    default: "marcin-jimenez"
  lakebase_reader_group:
    description: >-
      Databricks GROUP name the KPI read path connects as (a bring-your-own
      prerequisite: the group must exist and the app service principal must be a
      member). The bundle registers it as a Postgres group role via the
      databricks_auth extension and grants it USAGE + SELECT on the synced
      schema, so the app SP inherits read access through group membership --
      no per-SP object grant. The name is case-sensitive and must match the
      Databricks group's display name exactly.
    default: "cyber360-lakebase-readers"
  load_synthetic_data:
    description: "Gate the pipeline's demo-data ingest stage. true = load bundled OCSF CSVs; false = build views/aggregates over the customer's existing gold tables (bring-your-own-data)."
    default: true
  genie_identity_embed_url:
    description: "Genie Space embed URL for the Identity & Access domain drawer"
    default: ""
  genie_vulnerability_embed_url:
    description: "Genie Space embed URL for the Vulnerability Management domain drawer"
    default: ""
  pipeline_development:
    description: >-
      Whether the Lakeflow pipeline runs in development mode (reuses compute,
      relaxed retries -- fast iteration). MUST be false for a `mode: production`
      target, which rejects a development pipeline. Defaults true for dev/tst and
      is overridden to false in the prod target below.
    default: true

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

# The pipeline source and demo CSVs are synced into the workspace so the
# Lakeflow pipeline can reference them. cyber360.yaml is synced next to the
# pipeline so both the app and the pipeline read the SAME config SSOT.
sync:
  include:
    - pipelines/**
    - data/**
    - app/cyber360.yaml
    - resources/metricviews/**
    - resources/grant_reader_role.py

resources:
  # ── Lakebase autoscaling project: managed Postgres for KPI reads + app state ──
  # Creating the project auto-provisions a `production` branch and a `primary`
  # read-write endpoint; both are declared below with `replace_existing: true`
  # so the bundle can configure (rather than duplicate) them. The endpoint
  # autoscales between var.lakebase_min_cu and var.lakebase_max_cu -- no fixed
  # capacity SKU (that was the discontinued provisioned model).
  postgres_projects:
    cyber360_lakebase:
      project_id: ${var.lakebase_project}
      display_name: "Cyber360 Lakebase"
      default_endpoint_settings:
        autoscaling_limit_min_cu: ${var.lakebase_min_cu}
        autoscaling_limit_max_cu: ${var.lakebase_max_cu}

  postgres_branches:
    cyber360_production:
      branch_id: ${var.lakebase_branch}
      # parent references the project's `.name` output (resolves to
      # projects/<project_id>); NOT `.id`.
      parent: ${resources.postgres_projects.cyber360_lakebase.name}
      no_expiry: true
      is_protected: true
      # Take over the project's implicitly-created production branch.
      replace_existing: true

  postgres_endpoints:
    cyber360_primary:
      endpoint_id: ${var.lakebase_endpoint}
      # parent is the BRANCH (resolves to projects/<id>/branches/<branch_id>).
      parent: ${resources.postgres_branches.cyber360_production.name}
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      autoscaling_limit_min_cu: ${var.lakebase_min_cu}
      autoscaling_limit_max_cu: ${var.lakebase_max_cu}
      # Take over the project's implicitly-created primary endpoint.
      replace_existing: true

  postgres_databases:
    cyber360_db:
      database_id: ${var.lakebase_database}
      # parent is the BRANCH.
      parent: ${resources.postgres_branches.cyber360_production.name}
      # The Postgres-internal database name the app + synced tables connect to.
      postgres_database: ${var.lakebase_database}
      # Owner Postgres role -- required by the API in the full branch-scoped
      # path projects/<p>/branches/<b>/roles/<role_id>. Built from the branch
      # `.name` + the configured owner role id (see var.lakebase_owner_role).
      # Take over any implicitly-created db of the same id so the create is
      # deterministic across redeploys.
      role: ${resources.postgres_branches.cyber360_production.name}/roles/${var.lakebase_owner_role}
      replace_existing: true

  # NOTE: the Lakebase Postgres DB is intentionally NOT registered as a Unity
  # Catalog catalog. Registering it needs metastore-admin CREATE CATALOG, and the
  # app reads Lakebase directly via Postgres (not through UC), so the
  # registration is unnecessary. Add a `postgres_catalogs` resource later only if
  # you want UC governance over the synced tables AND hold CREATE CATALOG.

  # ── UC landing zone for OCSF gold tables, metric views and aggregates ──
  # PREREQUISITE: the UC catalog (${var.catalog}) must already exist and be
  # owned/accessible by the deploying user (bring-your-own-catalog). The bundle
  # only creates the schema inside it.
  schemas:
    cyber360_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: "Cyber360 OCSF-aligned cybersecurity posture data, metric views and KPI aggregates"

  volumes:
    cyber360_data:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.cyber360_schema.name}
      name: cyber360_data
      volume_type: MANAGED
      comment: "Bundled synthetic OCSF CSVs consumed by the pipeline's demo-load stage"

  # ── Lakeflow Declarative Pipeline: gold -> metric views -> aggregate tables ──
  # Config-driven: reads cyber360.yaml (synced next to the pipeline code) and the
  # LOAD_SYNTHETIC_DATA flag. Materializes the generic agg_daily / agg_rollup
  # tables (CDF-enabled, primary keys) that the synced tables reverse-ETL.
  pipelines:
    cyber360_pipeline:
      name: "[${bundle.target}] cyber360-aggregates"
      catalog: ${var.catalog}
      schema: ${resources.schemas.cyber360_schema.name}
      serverless: true
      channel: PREVIEW
      continuous: false
      development: ${var.pipeline_development}
      configuration:
        cyber360.catalog: ${var.catalog}
        cyber360.schema: ${resources.schemas.cyber360_schema.name}
        cyber360.load_synthetic_data: ${var.load_synthetic_data}
        cyber360.data_volume: "/Volumes/${var.catalog}/${resources.schemas.cyber360_schema.name}/cyber360_data"
      # Only the pipeline module + its lib package are pipeline SOURCE. Metric
      # views are no longer built by a Python script here -- they are declarative
      # .sql assets under resources/metricviews/, applied by the data-plane job's
      # sql_task steps against the SQL warehouse (UC Metric View DDL cannot run
      # inside a declarative pipeline).
      libraries:
        - glob:
            include: pipelines/cyber360_pipeline.py
        - glob:
            include: pipelines/lib/**

  # ── Orchestration job: pipeline (gold + aggregates) -> UC Metric Views ──
  # `CREATE ... VIEW WITH METRICS` is UC DDL that a declarative pipeline cannot
  # run, so each domain's metric view is a .sql asset under resources/metricviews/
  # applied by a sql_task chained after the pipeline, executed on the SQL
  # warehouse (var.warehouse_id). The .sql files carry no hardcoded location:
  # :catalog / :schema are passed as sql_task parameters and bound via
  # USE CATALOG/SCHEMA IDENTIFIER(...). Adding a domain = add a .sql file + a
  # task here. Run the whole data plane with:
  #   databricks bundle run cyber360_data_plane -t dev
  jobs:
    cyber360_data_plane:
      name: "[${bundle.target}] cyber360-data-plane"
      tasks:
        - task_key: build_aggregates
          pipeline_task:
            pipeline_id: ${resources.pipelines.cyber360_pipeline.id}
        - task_key: metric_view_identity
          depends_on:
            - task_key: build_aggregates
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ${workspace.file_path}/resources/metricviews/mv_identity_access.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.cyber360_schema.name}
        - task_key: metric_view_vulnerability
          depends_on:
            - task_key: build_aggregates
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ${workspace.file_path}/resources/metricviews/mv_vulnerability_mgmt.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.cyber360_schema.name}

    # ── Post-deploy grant: reader GROUP role -> read on synced Postgres schema ──
    # Registers the Databricks reader group (bring-your-own prerequisite) as a
    # Postgres group role and grants it USAGE + SELECT on the synced-aggregate
    # schema, so the app SP inherits KPI reads via group membership -- no per-SP
    # object grant. Databricks does NOT auto-propagate UC/uc_securable grants to
    # Postgres roles, so this Postgres-layer grant is required for the app's
    # direct psycopg read path.
    #
    # RUN THIS AS THE FINAL STEP of the deploy flow, AFTER the phase-2 deploy has
    # created the synced tables and their schema in Postgres:
    #   databricks bundle run cyber360_grant_reader_role -t dev
    # It runs as the deploying identity (the synced-schema owner) and is fully
    # idempotent (safe to re-run; ALTER DEFAULT PRIVILEGES covers future re-syncs).
    cyber360_grant_reader_role:
      name: "[${bundle.target}] cyber360-grant-reader-role"
      tasks:
        - task_key: grant_reader_role
          environment_key: grant_env
          spark_python_task:
            python_file: ${workspace.file_path}/resources/grant_reader_role.py
            parameters:
              - "--endpoint"
              - projects/${var.lakebase_project}/branches/${var.lakebase_branch}/endpoints/${var.lakebase_endpoint}
              - "--database"
              - ${var.lakebase_database}
              - "--schema"
              - ${resources.schemas.cyber360_schema.name}
              - "--group"
              - ${var.lakebase_reader_group}
      # Serverless job compute. psycopg is not in the base image, and the base
      # image's databricks-sdk predates the autoscaling `ws.postgres` API used to
      # mint the credential + resolve the host -- so pin a recent SDK too.
      environments:
        - environment_key: grant_env
          spec:
            client: "3"
            dependencies:
              - psycopg[binary]
              - databricks-sdk>=0.102.0

  # ── Native reverse-ETL: UC aggregate tables -> Lakebase Postgres (read-only) ──
  # Two generic tables cover every domain/measure with zero schema change:
  #   agg_daily  -> daily-grain measure series (trend/area charts)
  #   agg_rollup -> 30/60/90d windowed values + period-over-period deltas (tiles)
  # Autoscaling reverse-ETL: the synced table targets a BRANCH (not a fixed
  # instance) and a logical postgres_database. Fields are flat (no nested spec).
  # synced_table_id is the 3-part UC name of the SYNCED table that lands in UC;
  # source_table_full_name is the UC aggregate that feeds it.
  postgres_synced_tables:
    cyber360_agg_daily:
      synced_table_id: ${var.catalog}.${resources.schemas.cyber360_schema.name}.agg_daily_synced
      # branch references the production branch's `.name` output.
      branch: ${resources.postgres_branches.cyber360_production.name}
      postgres_database: ${var.lakebase_database}
      source_table_full_name: ${var.catalog}.${resources.schemas.cyber360_schema.name}.agg_daily
      primary_key_columns:
        - domain
        - day
        - measure
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${resources.schemas.cyber360_schema.name}

    cyber360_agg_rollup:
      synced_table_id: ${var.catalog}.${resources.schemas.cyber360_schema.name}.agg_rollup_synced
      branch: ${resources.postgres_branches.cyber360_production.name}
      postgres_database: ${var.lakebase_database}
      source_table_full_name: ${var.catalog}.${resources.schemas.cyber360_schema.name}.agg_rollup
      primary_key_columns:
        - domain
        - period
        - measure
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${resources.schemas.cyber360_schema.name}

  # ── The dashboard app (FastAPI + built React SPA) ──
  apps:
    cyber360_app:
      name: "cyber360-dashboard"
      description: "Cyber360 Unified Cybersecurity Posture Dashboard"
      source_code_path: ./app

      # Bind the Lakebase autoscaling branch as an app resource. This grants the
      # app SERVICE PRINCIPAL CAN_CONNECT_AND_CREATE on the branch (without this
      # the SP's minted token is rejected). KPI reads run as the app SP (NOT
      # per-user OBO); interactive Genie / SQL Warehouse access stays OBO.
      # NOTE: unlike the legacy `database:` binding, the autoscaling `postgres:`
      # binding does NOT auto-inject PGHOST / PGUSER / PGPORT / PGDATABASE. The
      # app self-configures at runtime from LAKEBASE_ENDPOINT_NAME (below):
      # PGHOST via postgres.get_endpoint(...).status.hosts.host, PGUSER from the
      # app SP's DATABRICKS_CLIENT_ID, password via generate_database_credential.
      # No Postgres host is hardcoded anywhere.
      resources:
        - name: "lakebase"
          postgres:
            # Binding stays on the PRODUCTION branch even for a feature deploy that
            # points the app at a FORK (app_connect_branch): a Lakebase fork
            # inherits the parent branch's roles + grants, so the SP's branch-level
            # CAN_CONNECT_AND_CREATE granted here carries to every fork. VERIFIED
            # end-to-end -- a fork off production exposed the identical SP role,
            # reader-group role, USAGE + SELECT grants, and synced KPI data. So the
            # env var (LAKEBASE_ENDPOINT_NAME) steers the connection target while
            # this binding (the grant) lives on the parent and is inherited. (The
            # fork is not a DAB-managed resource, so it cannot be referenced here.)
            branch: ${resources.postgres_branches.cyber360_production.name}
            # Full database path (projects/<id>/branches/<id>/databases/<id>); the
            # API rejects a bare logical name here.
            database: ${resources.postgres_databases.cyber360_db.name}
            permission: "CAN_CONNECT_AND_CREATE"
        # The `postgres:` binding above only grants the SP CONNECT + CREATE on the
        # branch -- NOT read access to the synced KPI tables (which land in a
        # UC-governed schema owned by the reverse-ETL writer role, not the app SP).
        # The synced aggregates are Unity Catalog securables, so we grant the app
        # SP SELECT on each declaratively via a `uc_securable` resource. Databricks
        # auto-grants the prerequisite USE CATALOG + USE SCHEMA, and for a
        # UC-governed Lakebase synced table that SELECT is what authorizes the
        # Postgres-side read the app performs. Referencing the synced-table
        # resource's `synced_table_id` also orders app deploy AFTER the table
        # exists, so the grant target is present. No manual Postgres GRANT needed.
        - name: "agg_daily_synced"
          uc_securable:
            securable_full_name: ${resources.postgres_synced_tables.cyber360_agg_daily.synced_table_id}
            securable_type: "TABLE"
            permission: "SELECT"
        - name: "agg_rollup_synced"
          uc_securable:
            securable_full_name: ${resources.postgres_synced_tables.cyber360_agg_rollup.synced_table_id}
            securable_type: "TABLE"
            permission: "SELECT"

      # App config (command + env) is BUNDLE-MANAGED so every workspace value
      # flows from DAB variables via ${var.*} / ${resources.*} substitution --
      # nothing is hardcoded, and the control plane writes app.yaml at deploy
      # time. (A static app.yaml cannot do ${var} substitution, which is why the
      # env lives here and app/app.yaml is intentionally absent.)
      config:
        command:
          - /bin/sh
          - -c
          - pip install -e . && uvicorn main:app --host 0.0.0.0 --port $DATABRICKS_APP_PORT
        env:
          - name: PYTHONUNBUFFERED
            value: "1"
          # Provider selection: "seed" (zero workspace deps) or "lakebase".
          - name: CYBER360_PROVIDER
            value: "lakebase"
          # Genie interactive drawer ONLY (OBO), never KPI reads.
          - name: DATABRICKS_WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: CYBER360_CATALOG
            value: ${var.catalog}
          - name: CYBER360_SCHEMA
            value: ${resources.schemas.cyber360_schema.name}
          # Fully-qualified Lakebase endpoint path -- the single source the app
          # needs to (a) mint an SP credential via
          # postgres.generate_database_credential(endpoint=...) and (b) resolve
          # PGHOST via postgres.get_endpoint(name=...). Composed from the same
          # DAB vars that define the project/branch/endpoint resources, so it is
          # never hardcoded and always tracks the deployed topology.
          # Uses app_connect_branch/endpoint (default = production/primary) so a
          # feature deploy can point the app at a forked Lakebase branch without
          # touching the managed production resources. A branch fork inherits the
          # parent's roles/grants, so the app SP's CONNECT + the reader group's
          # SELECT carry to the fork.
          - name: LAKEBASE_ENDPOINT_NAME
            value: projects/${var.lakebase_project}/branches/${var.app_connect_branch}/endpoints/${var.app_connect_endpoint}
          - name: LAKEBASE_DATABASE_NAME
            value: ${var.lakebase_database}
          # Databricks GROUP role the KPI read path connects as. The app SP is a
          # member of this group, so it connects with PGUSER = this name and its
          # own OAuth token, and the session runs AS the group role -- inheriting
          # the group's USAGE + SELECT on the synced schema (see the post-deploy
          # grant task). Centralizes the read grant on the group, not the SP.
          - name: LAKEBASE_READER_ROLE
            value: ${var.lakebase_reader_group}
          # GENIE_*_EMBED_URL are intentionally omitted while unset: the Apps API
          # rejects an env var whose value resolves empty, and the genie_*_embed_url
          # vars default to "". cyber360.yaml resolves the missing vars to "" (Genie
          # drawer simply stays unconfigured). When you wire real Genie spaces, add
          # them back here:
          #   - name: GENIE_IDENTITY_EMBED_URL
          #     value: ${var.genie_identity_embed_url}
          #   - name: GENIE_VULNERABILITY_EMBED_URL
          #     value: ${var.genie_vulnerability_embed_url}

      permissions:
        - level: CAN_MANAGE
          user_name: ${workspace.current_user.userName}

# NOTE on workspace host: `workspace.host` is an AUTHENTICATION field, which the
# Databricks CLI resolves BEFORE variable substitution -- so it cannot be a
# ${var.*} placeholder (the CLI errors: "Variable interpolation is not supported
# for fields that configure authentication"). It is therefore intentionally
# OMITTED here so the host resolves from the ambient environment, which is the
# portable default: deploying from a Databricks Git folder targets THAT
# workspace automatically; from a laptop it uses the active CLI profile or the
# DATABRICKS_HOST env var. To pin a host explicitly, set DATABRICKS_HOST (or use
# `-p <profile>` / `databricks auth login`) -- do NOT hardcode it back in here.
targets:
  # Dev: per-developer sandbox. `mode: development` prefixes resource names with
  # the deploying user, so many feature branches can coexist in one workspace
  # (see the feature-development flow in the operationalization guide).
  dev:
    default: true
    mode: development

  # Test / staging: a shared integration environment that mirrors prod topology
  # but still runs the pipeline in development mode for fast rebuilds. Promote
  # here from dev before prod.
  tst:
    mode: development

  # Prod: the released application, sourced from `main`. The pipeline must NOT be
  # in development mode here (mode: production rejects it), so pin the flag false.
  prod:
    mode: production
    variables:
      pipeline_development: false
    resources:
      apps:
        cyber360_app:
          permissions:
            - level: CAN_MANAGE
              user_name: ${workspace.current_user.userName}
            - level: CAN_USE
              group_name: "cyber360-users"
