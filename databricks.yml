# ============================================================================
# CyberUnified Unified Dashboard -- Databricks Asset Bundle
# ============================================================================
# Native, declarative data plane -- NO imperative scripts. Everything the
# dashboard needs is a DAB resource:
#
#   postgres_projects     -> Lakebase autoscaling project (managed Postgres) that
#                            serves the app's read-write STATE only. Auto-creates a
#                            `production` branch and a `primary` RW endpoint.
#   postgres_branches     -> the project's `production` branch (replace_existing)
#   postgres_endpoints    -> the project's `primary` RW endpoint (replace_existing)
#   postgres_databases    -> the logical Postgres database the app connects to
#   jobs                  -> the GATED synthetic-gold seed (sandbox only)
#   apps                  -> the FastAPI + React dashboard
#
# The semantic layer is a Unity Catalog METRIC VIEW that ALREADY EXISTS on the
# target. The app is given its name (domains[].metric_view.name in
# cyber-unified.yaml) and queries it per-user (OBO) -- the bundle creates no
# pipeline, no source view, and no metric view. Generating a metric view over
# synthetic data is a sandbox utility (setup/sandbox/*.sql +
# `make sandbox-metricview`), never a deployed resource.
#
# All workspace-specific values flow as DAB variables -> app.yaml env ->
# ${VAR} placeholders resolved in cyber-unified.yaml at startup. Never hardcode.
#
# NOTE on Genie: the current Databricks CLI does not expose a `genie_spaces`
# bundle resource, so Genie Spaces are referenced by embed URL (passed as the
# genie_*_embed_url variables). Create/curate the spaces in the workspace and
# point the variables at them; swapping a space stays a config edit.
# ============================================================================

bundle:
  name: cyber-unified

# ── Group-based access control (manage the GROUP, not individual users) ──
# Two bring-your-own Databricks groups drive WORKSPACE access. Add/remove a user
# from the group and their access to the CyberUnified app, data-plane job, and
# pipeline follows -- there is no per-user permission anywhere. The names are
# variables so the same bundle serves any workspace; the groups must PRE-EXIST
# (DABs cannot create groups).
#   manage_group -> app/job/pipeline CAN_MANAGE
#   user_group   -> app CAN_USE, job/pipeline CAN_VIEW
# These are declared PER-RESOURCE on the app/job/pipeline blocks (see the NOTE
# below), so each group gets exactly one grant per resource.
#
# DATA-LAYER (Unity Catalog) grants are NOT managed here: UC grant principals
# must be ACCOUNT-level groups (these are workspace groups), so granting the
# groups USE_CATALOG / USE_SCHEMA / SELECT on the catalog+schema (so members can
# query the metric views) is a one-time team/metastore-admin step. The exact
# grants are documented in README.md "Access control".
# NOTE: permissions are declared PER-RESOURCE (on the app, job, and pipeline
# blocks below), not in a top-level `permissions:` block -- bluebird's pattern. A
# top-level block propagates to every resource AND stacks with each resource's own
# block, so a group named in both gets assigned twice ("already has permissions
# set" warnings) -- doubly so when manage_group == user_group. Per-resource
# permissions give each group exactly one grant per resource and no warnings.

variables:
  manage_group:
    description: >-
      Databricks GROUP that manages CyberUnified workspace resources
      (app/job/pipeline CAN_MANAGE). Bring-your-own: the group must already exist
      (DABs cannot create groups). Data-layer (UC) grants are applied separately
      -- see README "Access control".
    default: "DPG_CYBER360_MANAGE"
  user_group:
    description: >-
      Databricks GROUP with read/use access to CyberUnified workspace resources
      (app CAN_USE, job/pipeline CAN_VIEW). To let members query the metric views,
      grant this group USE_CATALOG + USE_SCHEMA + SELECT on the catalog/schema
      out-of-band (see README "Access control"). Bring-your-own group.
    default: "DPG_CYBER360_USER"
  # Per-environment suffix so dev/tst/prd deploys coexist in a shared workspace
  # without name collisions (bluebird pattern). Applied to the workspace-level
  # RESOURCE names -- app + Lakebase project/database. Each target sets it
  # (_dev / _tst / _prd); empty by default (sandbox uses a bare name).
  # NOTE: this does NOT suffix the UC catalog/schema -- those are bring-your-own,
  # fixed, and often un-createable by the deployer (see catalog/schema below).
  env_suffix:
    description: "Per-env resource-name suffix (e.g. -dev / -tst / -prd). Empty = none."
    default: ""
  catalog:
    description: "Unity Catalog catalog for CyberUnified gold data, metric views and aggregates"
    default: "cyber-unified"
  schema:
    description: "Unity Catalog schema for CyberUnified tables, metric views and aggregates"
    default: "posture"
  warehouse_id:
    description: "SQL Warehouse ID -- used by Genie interactive drawer ONLY, never KPI reads"
    default: ""
  lakebase_project:
    description: "Lakebase autoscaling project id that serves KPI reads + app state (1-63 chars, lowercase/digits/hyphens)"
    default: "cyber-unified"
  lakebase_branch:
    description: "Lakebase branch id -- the project's auto-created production branch"
    default: "production"
  lakebase_endpoint:
    description: "Lakebase endpoint id -- the project's auto-created primary read-write endpoint"
    default: "primary"
  # ── App connection target (branch/endpoint the APP connects to) ──
  # These default to the managed production branch/endpoint above, so the normal
  # path is unchanged. For an ISOLATED FEATURE deploy, a paired Lakebase branch is
  # forked from production out-of-band (see .github/scripts/lakebase_branch.py),
  # then the app is deployed with `--var app_connect_branch=<feature-branch-id>
  # --var app_connect_endpoint=<feature-endpoint-id>` so it connects to the forked
  # branch's own data + endpoint. The managed postgres_* resources still manage
  # production only; these vars ONLY steer the app's connection target + binding.
  app_connect_branch:
    description: "Lakebase branch id the APP connects to (defaults to the production branch)."
    default: "production"
  app_connect_endpoint:
    description: "Lakebase endpoint id the APP connects to (defaults to the primary endpoint)."
    default: "primary"
  lakebase_min_cu:
    description: "Lakebase endpoint autoscaling floor in Compute Units (min 0.5)"
    default: 2
  lakebase_max_cu:
    description: "Lakebase endpoint autoscaling ceiling in Compute Units"
    default: 8
  lakebase_suspend_after:
    description: >-
      Inactivity period after which the Lakebase compute endpoint suspends
      (scale-to-zero). API accepts 60s..604800s (1 minute to 1 week); 86400s = 1
      day. Mutually exclusive with no_suspension.
    default: "86400s"
  app_compute_size:
    description: "Databricks App compute size: MEDIUM | LARGE (XLARGE is Private Preview)"
    default: "LARGE"
  lakebase_database:
    description: "Logical Postgres database name inside the Lakebase project (lowercase/digits/underscores)"
    default: "cyber-unified"
  lakebase_owner_role:
    description: >-
      Postgres role id that OWNS the app database. Lakebase auto-creates one
      role per Databricks identity (dots in the email localpart become hyphens),
      e.g. marcin.jimenez@databricks.com -> `marcin-jimenez`. Set this to the
      deploying identity's role id; it is combined with the branch path to form
      the full projects/<p>/branches/<b>/roles/<role_id> owner reference.
    default: "marcin-jimenez"
  load_synthetic_data:
    description: >-
      GATE for the synthetic-gold seed job (cyber_unified_seed_job). The job is a
      no-op unless this is explicitly true, so it defaults FALSE -- real-data
      targets must never seed over the customer's tables. The sandbox turns it on
      via `make seed sandbox`. This gates the SEED ONLY -- the app reads an
      already-published metric view and is unaffected.
    default: false
  # ── SANDBOX-UTILITY-ONLY variable ──
  # Source table the sandbox's GENERATED metric view reads. Used only by
  # `make sandbox-metricview`, which applies setup/sandbox/*.sql to emulate the
  # customer's metric view over synthetic gold. The BUNDLE never uses this: real
  # targets already have a published metric view and the app is given its name.
  phishing_source_table:
    description: >-
      SANDBOX UTILITY ONLY -- source table for the emulated metric view generated
      by `make sandbox-metricview`. Defaults to the unqualified `phishing_detail`
      (the seeded synthetic gold in ${var.catalog}.${var.schema}). Not referenced
      by any bundle resource.
    default: "phishing_detail"
  genie_phishing_embed_url:
    description: "Genie Space embed URL for the Phishing & Email Security domain drawer"
    default: ""
  # (var.pipeline_development removed with the Lakeflow pipeline -- there is no
  # pipeline to put in development mode any more.)

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

# Synced into the workspace for the SEED job only: the seed script, its generator
# library, and cyber-unified.yaml so the app and the seeder read the SAME config
# SSOT. (No setup/sandbox/*.sql -- the metric-view emulation is applied from the
# CLI by `make sandbox-metricview`, not by a deployed resource. No data/** --
# synthetic gold is generated in-code by lib.generator.)
sync:
  include:
    - pipelines/**
    - scripts/**
    - app/cyber-unified.yaml

resources:
  # ── Lakebase autoscaling project: managed Postgres for KPI reads + app state ──
  # Creating the project auto-provisions a `production` branch and a `primary`
  # read-write endpoint; both are declared below with `replace_existing: true`
  # so the bundle can configure (rather than duplicate) them. The endpoint
  # autoscales between var.lakebase_min_cu and var.lakebase_max_cu -- no fixed
  # capacity SKU (that was the discontinued provisioned model).
  postgres_projects:
    cyber_unified_lakebase:
      project_id: ${var.lakebase_project}
      display_name: "CyberUnified Lakebase"
      default_endpoint_settings:
        autoscaling_limit_min_cu: ${var.lakebase_min_cu}
        autoscaling_limit_max_cu: ${var.lakebase_max_cu}
        # Scale to zero after this much inactivity (1 day by default).
        suspend_timeout_duration: ${var.lakebase_suspend_after}

  postgres_branches:
    cyber_unified_production:
      branch_id: ${var.lakebase_branch}
      # parent references the project's `.name` output (resolves to
      # projects/<project_id>); NOT `.id`.
      parent: ${resources.postgres_projects.cyber_unified_lakebase.name}
      no_expiry: true
      is_protected: true
      # Take over the project's implicitly-created production branch.
      replace_existing: true

  postgres_endpoints:
    cyber_unified_primary:
      endpoint_id: ${var.lakebase_endpoint}
      # parent is the BRANCH (resolves to projects/<id>/branches/<branch_id>).
      parent: ${resources.postgres_branches.cyber_unified_production.name}
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      autoscaling_limit_min_cu: ${var.lakebase_min_cu}
      autoscaling_limit_max_cu: ${var.lakebase_max_cu}
      # Scale to zero after this much inactivity (1 day by default). Mutually
      # exclusive with no_suspension -- set one or the other, never both.
      suspend_timeout_duration: ${var.lakebase_suspend_after}
      # Take over the project's implicitly-created primary endpoint.
      replace_existing: true

  postgres_databases:
    cyber_unified_db:
      database_id: ${var.lakebase_database}
      # parent is the BRANCH.
      parent: ${resources.postgres_branches.cyber_unified_production.name}
      # The Postgres-internal database name the app + synced tables connect to.
      postgres_database: ${var.lakebase_database}
      # Owner Postgres role -- required by the API in the full branch-scoped
      # path projects/<p>/branches/<b>/roles/<role_id>. Built from the branch
      # `.name` + the configured owner role id (see var.lakebase_owner_role).
      # Take over any implicitly-created db of the same id so the create is
      # deterministic across redeploys.
      role: ${resources.postgres_branches.cyber_unified_production.name}/roles/${var.lakebase_owner_role}
      replace_existing: true

  # NOTE: the Lakebase Postgres DB is intentionally NOT registered as a Unity
  # Catalog catalog. Registering it needs metastore-admin CREATE CATALOG, and the
  # app reads Lakebase directly via Postgres (not through UC), so the
  # registration is unnecessary. Add a `postgres_catalogs` resource later only if
  # you want UC governance over the synced tables AND hold CREATE CATALOG.

  # ── UC landing zone (BRING-YOUR-OWN catalog + schema) ──
  # PREREQUISITE: the catalog (${var.catalog}) AND schema (${var.schema}) must
  # ALREADY EXIST and be writable by the deploying user. The bundle does NOT
  # create or manage the schema -- on a governed workspace the deployer typically
  # lacks CREATE SCHEMA on the catalog (e.g. `innovation`), and the customer owns
  # the schema layout. The pipeline + metric-view sql_tasks write their tables/
  # views INTO ${var.catalog}.${var.schema} using it directly (var.schema, not a
  # bundle-managed schema resource).
  #
  # No managed `volumes:` resource either: the pipeline generates synthetic gold
  # IN-CODE (lib/generator.generate_gold), so nothing reads a volume/CSV, and a
  # MANAGED volume would need CREATE on the schema we don't own.
  #
  # UC grants (USE_CATALOG / USE_SCHEMA / SELECT for user_group so members can
  # query the metric views) are a one-time metastore-admin step -- see README
  # "Access control". They are not managed here (UC grant principals must be
  # ACCOUNT-level groups, not the workspace groups used for app/job permissions).

  # ── THE APP READS AN EXISTING UC METRIC VIEW. IT CREATES NOTHING. ──
  # We standardize on the Unity Catalog metric view as the semantic layer. On a
  # real target it is ALREADY PUBLISHED and owned by the customer; the app is
  # handed its NAME (domains[].metric_view.name in cyber-unified.yaml) and just
  # queries it -- both KPI MEASURE()s and the drill-down rows. The name can differ
  # per environment; that is the whole per-target contract.
  #
  # So there is NO `pipelines:` resource and NO data-plane job. Both used to exist
  # and both were wrong for the same reason -- they CREATED things in the
  # customer's workspace:
  #   * the Lakeflow pipeline built synthetic gold (and with
  #     load_synthetic_data=false defined zero tables -> failed graph analysis);
  #   * the data-plane job ran CREATE OR REPLACE VIEW phishing_source (needed
  #     USE CATALOG on the customer's federated source catalog -> denied) and then
  #     CREATE VIEW ... WITH METRICS, re-publishing a metric view that already
  #     existed.
  #
  # Generating a metric view + synthetic data is a SANDBOX UTILITY, not part of
  # the application: setup/sandbox/*.sql applied by `make sandbox-metricview`, and
  # the gated seed job below. Neither is a deploy step, and neither is needed by
  # any real target.

  jobs:
    # ── Synthetic gold seed -- SANDBOX ONLY, and GATED (bluebird idiom) ──
    # NEVER writes anything unless var.load_synthetic_data resolves true (default
    # false), so it is inert even if it lands on a target that should not seed. It
    # is NOT part of `make deploy` -- run it explicitly with `make seed sandbox`.
    #
    # Real-data targets (edp_dev/prod) have their own tables and never run this;
    # the sandbox uses it to MIMIC the customer's schema so the same metric-view
    # shape works against both.
    cyber_unified_seed_job:
      name: "[${bundle.target}] cyber-unified-seed-synthetic-gold (gated)"
      # Serverless. The generator needs no extra packages (stdlib + PySpark from
      # the runtime), but a serverless task still needs an environment to attach.
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
      tasks:
        - task_key: seed_synthetic_gold
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/seed_synthetic_gold.py
            parameters:
              - "--load_synthetic_data=${var.load_synthetic_data}"
              - "--catalog=${var.catalog}"
              - "--schema=${var.schema}"
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.manage_group}
        - level: CAN_VIEW
          group_name: ${var.user_group}

  # ── The dashboard app (FastAPI + built React SPA) ──
  apps:
    cyber_unified_app:
      # env_suffix keeps dev/tst/prd app names distinct in a shared workspace
      # (e.g. cyber-unified-dev). Empty on the sandbox -> bare name.
      name: "cyber-unified${var.env_suffix}"
      description: "CyberUnified Cybersecurity Posture Dashboard"
      source_code_path: ./app
      # App compute size (MEDIUM | LARGE; XLARGE is Private Preview).
      compute_size: ${var.app_compute_size}

      # User authorization (on-behalf-of-user). Declaring `user_api_scopes` makes
      # Databricks forward the signed-in user's access token to the app in the
      # `X-Forwarded-Access-Token` header, which the OBOMiddleware reads. KPI reads
      # then run the SQL-warehouse metric-view queries AS THE USER (per-user UC
      # permissions enforced), not as the app SP -- so no SP grant on the metric
      # views is needed. `sql` is the scope for the Statement Execution API /
      # warehouse + UC data reads. On first visit each user consents once.
      # (Declarative here so it deploys identically to any workspace.)
      user_api_scopes:
        - sql

      # Bind the Lakebase autoscaling branch as an app resource. This grants the
      # app SERVICE PRINCIPAL CAN_CONNECT_AND_CREATE on the branch, which the app
      # uses ONLY for its own read-write state schema (preferences/chats/sessions).
      # KPI reads no longer touch Lakebase -- they query the UC metric views on the
      # SQL Warehouse per-user (OBO). NOTE: the autoscaling `postgres:` binding
      # does NOT auto-inject PGHOST/PGUSER/PGPORT/PGDATABASE; the app self-configures
      # from LAKEBASE_ENDPOINT_NAME (below): host via postgres.get_endpoint(...),
      # PGUSER from the app SP's DATABRICKS_CLIENT_ID, password via
      # generate_database_credential. No Postgres host is hardcoded anywhere.
      resources:
        - name: "lakebase"
          postgres:
            branch: ${resources.postgres_branches.cyber_unified_production.name}
            # Full database path (projects/<id>/branches/<id>/databases/<id>); the
            # API rejects a bare logical name here.
            database: ${resources.postgres_databases.cyber_unified_db.name}
            permission: "CAN_CONNECT_AND_CREATE"

      # App config (command + env) is BUNDLE-MANAGED so every workspace value
      # flows from DAB variables via ${var.*} / ${resources.*} substitution --
      # nothing is hardcoded, and the control plane writes app.yaml at deploy
      # time. (A static app.yaml cannot do ${var} substitution, which is why the
      # env lives here and app/app.yaml is intentionally absent.)
      config:
        command:
          - /bin/sh
          - -c
          - pip install -e . && uvicorn main:app --host 0.0.0.0 --port $DATABRICKS_APP_PORT
        env:
          - name: PYTHONUNBUFFERED
            value: "1"
          # Provider selection: "seed" (zero workspace deps) or "metricview"
          # (native UC metric-view queries on the SQL Warehouse).
          - name: CYBERUNIFIED_PROVIDER
            value: "metricview"
          # SQL Warehouse: serves the KPI metric-view reads (per-user OBO) AND the
          # Genie interactive drawer.
          - name: DATABRICKS_WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: CYBERUNIFIED_CATALOG
            value: ${var.catalog}
          - name: CYBERUNIFIED_SCHEMA
            value: ${var.schema}
          # Lakebase endpoint path -- used ONLY for the app-owned state pool now
          # (mint SP credential via generate_database_credential, resolve host via
          # get_endpoint). app_connect_branch/endpoint default to production/primary;
          # a feature deploy can point state at a forked branch. Never hardcoded.
          - name: LAKEBASE_ENDPOINT_NAME
            value: projects/${var.lakebase_project}/branches/${var.app_connect_branch}/endpoints/${var.app_connect_endpoint}
          - name: LAKEBASE_DATABASE_NAME
            value: ${var.lakebase_database}
          # GENIE_*_EMBED_URL are intentionally omitted while unset: the Apps API
          # rejects an env var whose value resolves empty, and genie_phishing_embed_url
          # defaults to "". cyber-unified.yaml resolves the missing var to "" (Genie
          # drawer simply stays unconfigured). When you wire a real Genie space, add
          # it back here:
          #   - name: GENIE_PHISHING_EMBED_URL
          #     value: ${var.genie_phishing_embed_url}

      # Per-resource permissions (no top-level block): deployer + manage_group
      # CAN_MANAGE, user_group CAN_USE (open + run the app). If manage_group ==
      # user_group (e.g. edp_dev's single QA group), the CLI de-dupes to the
      # highest level (CAN_MANAGE) with no warning.
      permissions:
        - level: CAN_MANAGE
          user_name: ${workspace.current_user.userName}
        - level: CAN_MANAGE
          group_name: ${var.manage_group}
        - level: CAN_USE
          group_name: ${var.user_group}

# NOTE on workspace host: `workspace.host` is an AUTHENTICATION field, which the
# Databricks CLI resolves BEFORE variable substitution -- so it cannot be a
# ${var.*} placeholder (the CLI errors: "Variable interpolation is not supported
# for fields that configure authentication"). It is therefore intentionally
# OMITTED here so the host resolves from the ambient environment, which is the
# portable default: deploying from a Databricks Git folder targets THAT
# workspace automatically; from a laptop it uses the active CLI profile or the
# DATABRICKS_HOST env var. To pin a host explicitly, set DATABRICKS_HOST (or use
# `-p <profile>` / `databricks auth login`) -- do NOT hardcode it back in here.
targets:
  # ── databricks_sandbox: FEVM demo/dev box (SYNTHETIC data) ──
  # The working environment for building + testing the app end-to-end, and the
  # ONLY target that generates anything. Two sandbox-only utility steps EMULATE
  # what a real workspace already provides:
  #   make seed sandbox              -> write the synthetic `phishing_detail` gold
  #                                     table (mimics the real CyberArk schema)
  #   make sandbox-metricview sandbox -> publish a metric view over it, so
  #                                     metric_view.name resolves here too
  # Neither is a deploy step; neither exists on a real target.
  # `workspace.host` is a literal per-target (it cannot be a ${var} -- it
  # configures auth), which pins the deploy to the FEVM sandbox.
  databricks_sandbox:
    default: true
    # No `mode: development` (bluebird pattern) -- avoid dev-mode name-mangling so
    # object names are stable/predictable. The top-level per-user `root_path`
    # already isolates deploy state between developers on the shared FEVM.
    # (NOTE: this renames the schema from the old dev-prefixed
    # `dev_<user>_posture` to plain `posture` on the next deploy -- nothing
    # hardcodes the old name, and the app resolves the schema from CYBERUNIFIED_SCHEMA.)
    workspace:
      host: https://fevm-real-time-mode-demo.cloud.databricks.com
    variables:
      # This FEVM has no `cyber-unified` catalog; use its shared demo catalog (the
      # bundle creates the `posture` schema inside it). Serverless Starter
      # warehouse serves the metric-view KPI reads (auto-starts on query).
      catalog: real_time_mode_demo_catalog
      warehouse_id: "1916c91c970b63b5"

  # ── edp_dev: EDP Azure DEV (REAL CyberArk source) ──
  # Deploys the same app against the real, CyberArk-federated phishing table.
  # No synthetic load -- the metric view reads conn_cyberarch.dbo.phishing_detail
  # directly (bring-your-own-data). Same workspace bluebird's `dev` target uses.
  edp_dev:
    # No `mode: development` (bluebird pattern): dev-mode name-mangling would
    # rewrite the schema (cybersecurity -> dev_<user>_cybersecurity) and prefix the
    # app/job/pipeline. This is a shared QA workspace with FIXED object names, so we
    # deploy bare -- the metric view lands at exactly
    # innovation.cybersecurity.phishing_detail_metric_view. The per-user bundle
    # root_path (top-level `workspace.root_path`) still isolates deploy state.
    workspace:
      host: https://adb-5918574733311837.17.azuredatabricks.net
    variables:
      # Per-env suffix on the workspace RESOURCE names (app + Lakebase project/db)
      # so a future _tst/_prd on the same workspace won't collide. -dev here.
      env_suffix: "-dev"
      lakebase_project: cyber-unified-dev
      # Hyphen, not underscore: lakebase_database feeds database_id, which must
      # match ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$ (no underscores).
      lakebase_database: cyber-unified-dev
      # NOTE: no phishing_source_table here. This workspace ALREADY has its
      # published metric view; the app is given its name via
      # domains[].metric_view.name in cyber-unified.yaml and reads it. Nothing is
      # created, so no privilege on conn_cyberarch is needed. load_synthetic_data
      # also stays FALSE (its default) -- real data, never seed.
      #
      # Where the app LOOKS for that metric view (bring-your-own; the bundle does
      # NOT create the schema): innovation.cybersecurity ->
      # innovation.cybersecurity.phishing_detail_metric_view, queried via
      # MEASURE(). FIXED (not suffixed): the deployer lacks CREATE on
      # `innovation`, and the customer owns the schema name.
      catalog: innovation
      schema: cybersecurity
      # Serverless SQL warehouse (id from the workspace warehouse URL). Serves the
      # app's per-user KPI + drill-down reads.
      warehouse_id: "67db57985bbae271"
      # QA group drives workspace access via the per-resource permission blocks:
      # CAN_MANAGE on app/job/pipeline + CAN_USE on the app. manage_group ==
      # user_group here, so the CLI de-dupes to CAN_MANAGE (no "already set"
      # warning). Must PRE-EXIST (DABs cannot create groups). Data-layer UC grants
      # remain a one-time metastore-admin step (README "Access control").
      manage_group: DPG_CYBERSECURITY_QA
      user_group: DPG_CYBERSECURITY_QA

  # Prod: the released application, sourced from `main`. Real customer data, so
  # load_synthetic_data stays FALSE (its default) and nothing seeds here.
  prod:
    mode: production
    # `mode: production` requires an explicit, non-user-scoped root_path so the
    # deploy is a single shared copy (not prefixed per deploying user like dev).
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    # Permissions are group-driven and identical across targets (the per-resource
    # blocks reference ${var.manage_group} / ${var.user_group}), so prod needs no
    # permission override here.
