name: Feature teardown

# Deletes the paired Lakebase feature branch (and its endpoint) when a feature
# PR is closed (merged or abandoned). Keeps the project clean and avoids paying
# for idle forked branches. Idempotent -- safe if the branch was already gone.

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  LAKEBASE_PROJECT: ${{ vars.CYBER360_LAKEBASE_PROJECT }}

jobs:
  teardown:
    name: Delete paired Lakebase branch
    # Only for feature/** source branches (the ones feature-deploy paired).
    if: startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "databricks-sdk>=0.102.0"

      - name: Derive the same branch id feature-deploy used
        id: ids
        run: |
          RAW="${GITHUB_HEAD_REF#feature/}"
          SAFE=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')
          SAFE="feat-${SAFE}"; SAFE="${SAFE:0:63}"; SAFE="${SAFE%-}"
          echo "branch_id=$SAFE"   >> "$GITHUB_OUTPUT"
          echo "endpoint_id=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Delete branch + endpoint
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python3 .github/scripts/lakebase_branch.py delete \
            --project "$LAKEBASE_PROJECT" \
            --branch-id "${{ steps.ids.outputs.branch_id }}" \
            --endpoint-id "${{ steps.ids.outputs.endpoint_id }}"

      - name: Summary
        if: always()
        run: echo "Tore down paired Lakebase branch \`${{ steps.ids.outputs.branch_id }}\`." >> "$GITHUB_STEP_SUMMARY"
