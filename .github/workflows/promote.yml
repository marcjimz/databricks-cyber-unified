name: Promote

# Release to prod. Promotion is a MANUAL, gated step (workflow_dispatch) so a
# human approves the release -- the prod app is always sourced from `main`.

on:
  workflow_dispatch:

jobs:
  promote:
    name: Deploy prod
    runs-on: ubuntu-latest
    # Runs against the protected 'prod' GitHub environment, so required reviewers
    # gate the release.
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Build SPA
        run: |
          bash .github/scripts/npm-install.sh
          cd app/frontend && npm run build

      - uses: databricks/setup-cli@main

      - name: Check for Databricks credentials
        id: creds
        env:
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          if [ -n "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Databricks OAuth credentials not configured -- skipping promotion deploy. Add the repo secret + variables to enable."
          fi

      - name: Deploy bundle
        if: steps.creds.outputs.configured == 'true'
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          CATALOG: ${{ vars.CYBER360_CATALOG }}
          WAREHOUSE_ID: ${{ vars.CYBER360_WAREHOUSE_ID }}
          OWNER_ROLE: ${{ vars.CYBER360_OWNER_ROLE }}
        run: |
          databricks bundle deploy -t prod \
            --var catalog="$CATALOG" \
            --var warehouse_id="$WAREHOUSE_ID" \
            --var lakebase_owner_role="$OWNER_ROLE"

      # Build the data plane (gold + metric views w/ materialization) then start
      # the app. Idempotent. State migrations run automatically at app startup.
      - name: Build data plane + start app
        if: steps.creds.outputs.configured == 'true'
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          CATALOG: ${{ vars.CYBER360_CATALOG }}
          WAREHOUSE_ID: ${{ vars.CYBER360_WAREHOUSE_ID }}
          OWNER_ROLE: ${{ vars.CYBER360_OWNER_ROLE }}
        run: |
          VARS="--var catalog=$CATALOG --var warehouse_id=$WAREHOUSE_ID --var lakebase_owner_role=$OWNER_ROLE"
          databricks bundle run cyber360_data_plane -t prod $VARS
          databricks bundle run cyber360_app -t prod $VARS
