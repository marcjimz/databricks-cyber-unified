name: Feature deploy (paired branch)

# Isolated per-feature environment. On push to a feature/** branch:
#   1. Fork a PAIRED Lakebase branch off production (own copy-on-write data +
#      its own read-write endpoint). The fork inherits prod's roles/grants, so
#      the app SP CONNECT + reader-group SELECT carry over -- no extra grant.
#   2. Deploy the bundle to dev, pointing the app at the forked branch/endpoint
#      via --var app_connect_branch/app_connect_endpoint. dev-mode also prefixes
#      resource names per-identity, so the app instance is isolated too.
#   3. Smoke-test the app's health endpoint.
# Teardown happens in feature-teardown.yml when the PR closes.

on:
  push:
    branches:
      - "feature/**"

concurrency:
  group: feature-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deploy-time overrides live as repo/environment variables so the workflow is
  # portable across workspaces. Host + token come from secrets.
  CATALOG: ${{ vars.CYBER360_CATALOG }}
  WAREHOUSE_ID: ${{ vars.CYBER360_WAREHOUSE_ID }}
  OWNER_ROLE: ${{ vars.CYBER360_OWNER_ROLE }}
  LAKEBASE_PROJECT: ${{ vars.CYBER360_LAKEBASE_PROJECT }}

jobs:
  deploy:
    name: Fork Lakebase branch + deploy isolated app
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK (for the branch script)
        run: pip install "databricks-sdk>=0.102.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build SPA
        run: cd app/frontend && npm ci && npm run build

      - uses: databricks/setup-cli@main

      - name: Derive a safe Lakebase branch id from the git branch
        id: ids
        run: |
          # Lakebase ids: lowercase alphanumeric + hyphens, 3-63 chars.
          RAW="${GITHUB_REF_NAME#feature/}"
          SAFE=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')
          SAFE="feat-${SAFE}"
          SAFE="${SAFE:0:63}"; SAFE="${SAFE%-}"
          echo "branch_id=$SAFE"   >> "$GITHUB_OUTPUT"
          echo "endpoint_id=$SAFE" >> "$GITHUB_OUTPUT"
          echo "Paired Lakebase branch id: $SAFE"

      - name: Fork paired Lakebase branch off production
        id: fork
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # The script forks the branch and DISCOVERS its inherited endpoint
          # (a fork auto-creates an RW endpoint, usually `primary`). Capture the
          # real branch_id + endpoint_id from its JSON stdout.
          OUT=$(python3 .github/scripts/lakebase_branch.py create \
            --project "$LAKEBASE_PROJECT" \
            --source-branch production \
            --branch-id "${{ steps.ids.outputs.branch_id }}" \
            --endpoint-id "${{ steps.ids.outputs.endpoint_id }}" \
            --min-cu 0.5 --max-cu 1)
          echo "$OUT"
          echo "branch_id=$(echo "$OUT"   | python3 -c 'import sys,json; print(json.load(sys.stdin)["branch_id"])')"   >> "$GITHUB_OUTPUT"
          echo "endpoint_id=$(echo "$OUT" | python3 -c 'import sys,json; print(json.load(sys.stdin)["endpoint_id"])')" >> "$GITHUB_OUTPUT"

      - name: Deploy app pointed at the forked branch
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy -t dev \
            --var catalog="$CATALOG" \
            --var warehouse_id="$WAREHOUSE_ID" \
            --var lakebase_owner_role="$OWNER_ROLE" \
            --var app_connect_branch="${{ steps.fork.outputs.branch_id }}" \
            --var app_connect_endpoint="${{ steps.fork.outputs.endpoint_id }}"
          databricks bundle run cyber360_app -t dev \
            --var catalog="$CATALOG" \
            --var warehouse_id="$WAREHOUSE_ID" \
            --var lakebase_owner_role="$OWNER_ROLE" \
            --var app_connect_branch="${{ steps.fork.outputs.branch_id }}" \
            --var app_connect_endpoint="${{ steps.fork.outputs.endpoint_id }}"

      - name: Smoke test (app health)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # Resolve the deployed app URL from the bundle summary and hit /api/health.
          URL=$(databricks bundle summary -t dev -o json \
            --var catalog="$CATALOG" --var warehouse_id="$WAREHOUSE_ID" \
            --var lakebase_owner_role="$OWNER_ROLE" \
            --var app_connect_branch="${{ steps.fork.outputs.branch_id }}" \
            --var app_connect_endpoint="${{ steps.fork.outputs.endpoint_id }}" \
            2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['resources']['apps']['cyber360_app'].get('url',''))" || true)
          if [ -z "$URL" ]; then
            echo "::warning::Could not resolve app URL from bundle summary; skipping HTTP smoke test."
            exit 0
          fi
          echo "Testing $URL/api/health"
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $DATABRICKS_TOKEN" "$URL/api/health" || true)
            echo "attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "Health OK"; exit 0; fi
            sleep 15
          done
          echo "::error::App health check did not return 200"; exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Feature environment :rocket:"
            echo "- Git branch: \`${GITHUB_REF_NAME}\`"
            echo "- Paired Lakebase branch: \`${{ steps.fork.outputs.branch_id }}\` (forked from production)"
            echo "- App: dev target, isolated (per-identity prefixed), connected to the forked branch"
            echo ""
            echo "The branch is torn down automatically when the PR closes."
          } >> "$GITHUB_STEP_SUMMARY"
