name: Feature branch (fork Lakebase branch)

# Isolated DATA per feature branch. On push to a feature/** branch, fork a paired
# Lakebase branch off production (copy-on-write snapshot; its own read-write
# endpoint) so schema/data experiments never touch shared data. That's the cheap,
# valuable half of isolation.
#
# It intentionally does NOT deploy a per-branch app: Databricks Apps are a
# long-running per-environment service (one shared dev app), not per-PR previews
# -- spinning app compute + re-consent per branch isn't worth it. Test the app
# against this forked branch via the local dev-loop (point LAKEBASE_ENDPOINT_NAME
# at the fork) or the shared dev app. The branch is deleted on PR close
# (feature-teardown.yml).

on:
  push:
    branches:
      - "feature/**"

concurrency:
  group: feature-branch-${{ github.ref }}
  cancel-in-progress: true

env:
  LAKEBASE_PROJECT: ${{ vars.CYBER360_LAKEBASE_PROJECT }}

jobs:
  fork:
    name: Fork paired Lakebase branch
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK (for the branch script)
        run: pip install "databricks-sdk>=0.102.0"

      - name: Check for Databricks credentials
        id: creds
        env:
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          if [ -n "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Databricks OAuth credentials not configured -- skipping Lakebase branch fork. Add the repo secret + variables to enable."
          fi

      - name: Derive a safe Lakebase branch id from the git branch
        if: steps.creds.outputs.configured == 'true'
        id: ids
        run: |
          # Lakebase ids: lowercase alphanumeric + hyphens, 3-63 chars.
          RAW="${GITHUB_REF_NAME#feature/}"
          SAFE=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')
          SAFE="feat-${SAFE}"
          SAFE="${SAFE:0:63}"; SAFE="${SAFE%-}"
          echo "branch_id=$SAFE"   >> "$GITHUB_OUTPUT"
          echo "endpoint_id=$SAFE" >> "$GITHUB_OUTPUT"
          echo "Paired Lakebase branch id: $SAFE"

      - name: Fork paired Lakebase branch off production
        if: steps.creds.outputs.configured == 'true'
        id: fork
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          python3 .github/scripts/lakebase_branch.py create \
            --project "$LAKEBASE_PROJECT" \
            --source-branch production \
            --branch-id "${{ steps.ids.outputs.branch_id }}" \
            --endpoint-id "${{ steps.ids.outputs.endpoint_id }}" \
            --min-cu 0.5 --max-cu 1

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.creds.outputs.configured }}" != "true" ]; then
            echo "### Lakebase branch fork skipped :warning:" >> "$GITHUB_STEP_SUMMARY"
            echo "Databricks OAuth credentials are not configured. Add the repo secret + variables to enable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Paired Lakebase branch ready :deciduous_tree:"
            echo "- Git branch: \`${GITHUB_REF_NAME}\`"
            echo "- Lakebase branch: \`${{ steps.ids.outputs.branch_id }}\` (forked from production)"
            echo ""
            echo "Point the app at it via LAKEBASE_ENDPOINT_NAME (local dev-loop or the shared dev app)."
            echo "Deleted automatically when the PR closes."
          } >> "$GITHUB_STEP_SUMMARY"
