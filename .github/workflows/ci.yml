name: CI

# PR gate: lint, build the SPA, validate the bundle, and check migrations parse.
# Lint/build need no workspace credentials. Bundle validate authenticates via
# OAuth M2M (service principal): DATABRICKS_HOST + DATABRICKS_CLIENT_ID come from
# repo VARIABLES, DATABRICKS_CLIENT_SECRET from a repo SECRET -- the CLI detects
# these env vars automatically (no PAT).

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"

jobs:
  backend:
    name: Backend lint + migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (with dev tools)
        run: cd app && pip install -e ".[dev]"
      - name: Ruff lint
        run: cd app && ruff check .
      - name: Migration files are well-formed
        # Every migrations/versions/*.sql must match NNNN__name.sql and versions
        # must be unique + contiguous-ish (ascending). Fails the PR otherwise.
        run: python .github/scripts/check_migrations.py

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend
        run: bash .github/scripts/npm-install.sh
      - name: Lint
        run: cd app/frontend && npm run lint
      - name: Build SPA
        run: cd app/frontend && npm run build
      - name: SPA build is committed and current
        # The Databricks Apps runtime has no build step, so app/frontend/dist must
        # be committed. Fail if a fresh build differs from what's checked in.
        run: |
          if ! git diff --quiet -- app/frontend/dist; then
            echo "::error::app/frontend/dist is stale. Run 'make build' and commit the result."
            git --no-pager diff --stat -- app/frontend/dist
            exit 1
          fi

  bundle:
    name: Validate bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Check for Databricks credentials
        id: creds
        env:
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          if [ -n "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Databricks OAuth credentials not configured (secret DATABRICKS_CLIENT_SECRET missing) -- skipping bundle validation. Add the repo secret + variables to enable."
          fi
      - name: Validate dev + prod targets
        if: steps.creds.outputs.configured == 'true'
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          for t in dev prod; do
            echo "== validate $t =="
            databricks bundle validate -t "$t"
          done
