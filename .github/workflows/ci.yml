name: CI

# PR gate: lint + tests, build the SPA, check migrations parse, and validate the
# bundle. Lint/build/tests need no workspace credentials. Bundle validate runs in
# the `dev` GitHub environment, authenticated as its service principal under the
# profile databricks_dev declares (.github/actions/databricks-auth). Only dev is
# validated here: tst/prd credentials sit behind approval-gated environments, so
# the release workflow validates each of them right before it deploys.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + tests + migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (with dev tools)
        run: cd app && pip install -e ".[dev]"
      - name: Ruff lint
        run: cd app && ruff check .
      - name: Tests (incl. the architecture guard suite)
        run: cd app && python -m pytest -q
      - name: Migration files are well-formed
        # Every migrations/versions/*.sql must match NNNN__name.sql and versions
        # must be unique + contiguous-ish (ascending). Fails the PR otherwise.
        run: python .github/scripts/check_migrations.py

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend
        run: bash .github/scripts/npm-install.sh
      - name: Lint
        run: cd app/frontend && npm run lint
      - name: Build SPA
        run: cd app/frontend && npm run build
      - name: SPA build is committed and current
        # The Databricks Apps runtime has no build step, so app/frontend/dist must
        # be committed. Fail if a fresh build differs from what's checked in.
        run: |
          if ! git diff --quiet -- app/frontend/dist; then
            echo "::error::app/frontend/dist is stale. Run 'make build' and commit the result."
            git --no-pager diff --stat -- app/frontend/dist
            exit 1
          fi

  bundle:
    name: Validate bundle (databricks_dev)
    runs-on: ubuntu-latest
    # Fork PRs get no secrets (public repo); auth then reports configured=false.
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate
        id: auth
        uses: ./.github/actions/databricks-auth
        with:
          target: databricks_dev
          host: ${{ secrets.DATABRICKS_HOST }}
          client-id: ${{ secrets.DATABRICKS_CLIENT_ID }}
          client-secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      - name: Validate databricks_dev
        if: steps.auth.outputs.configured == 'true'
        run: databricks bundle validate -t databricks_dev
