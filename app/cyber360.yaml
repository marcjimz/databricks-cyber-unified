# ============================================================================
# Cyber360 Dashboard Configuration
# ============================================================================
# This file drives every aspect of the dashboard: domains, measures, KPIs,
# Genie Spaces, and data sources. Customers change THIS file to point at
# their own data -- no code changes required.
#
# Environment variable placeholders (${VAR_NAME}) are resolved at startup
# from the app's environment, which is populated by DAB variables.
# ============================================================================

# --- Organization identity ---
org:
  name: "Acme Health"
  logo_path: "org-logo.png"

# --- Data source configuration ---
data_source:
  catalog: "${CYBER360_CATALOG}"
  schema: "${CYBER360_SCHEMA}"
  warehouse_id: "${DATABRICKS_WAREHOUSE_ID}"   # SQL Warehouse: KPI metric-view reads + Genie drawer
  # "seed"       = in-memory OCSF synthesis (zero workspace deps, demo/local).
  # "metricview" = query UC metric views natively on the SQL Warehouse (per-user
  #                OBO), accelerated by metric-view materialization.
  provider: "${CYBER360_PROVIDER:-seed}"

# --- Lakebase configuration ---
# Lakebase now serves ONE role: app-owned read-write state (preferences/chats/
# sessions) via idempotent session-bootstrap migrations. KPI reads moved to
# native metric-view queries on the SQL Warehouse (provider: metricview), so the
# read-only synced aggregates + reader group role are gone.
lakebase:
  enabled: true
  # Autoscaling endpoint path (projects/<p>/branches/<b>/endpoints/<e>) used to
  # mint the SP credential and resolve the Postgres host.
  endpoint_name: "${LAKEBASE_ENDPOINT_NAME}"
  database_name: "${LAKEBASE_DATABASE_NAME:-cyber360}"
  # Postgres schema the app service principal owns for its read-write state
  # tables (created + owned by the app at startup; no external grant needed).
  app_schema: "cyber360_app"
  # App-owned state tables (read-write, created by session-bootstrap migrations).
  state_tables:
    preferences: "cyber360_preferences"
    chats: "cyber360_chats"
    sessions: "cyber360_sessions"

# --- Data loading configuration ---
data_loading:
  enabled: true
  target_catalog: "${CYBER360_CATALOG}"
  target_schema: "${CYBER360_SCHEMA}"
  load_synthetic: true

# --- Feature flags ---
features:
  genie_enabled: true
  soc_view_enabled: false
  theme_toggle: true
  lineage_popover: true

# --- Executive scorecard top-line KPIs ---
# NOTE: period-over-period movement is computed programmatically from the
# selected reporting period (30/60/90d) and surfaced as each KPI's `change`
# line -- no hardcoded `trend` labels here. Keep captions only.
top_line_kpis:
  - domain: phishing
    measure: phishing_click_rate
    caption: "Phishing click rate"

  - domain: phishing
    measure: phishing_report_rate
    caption: "Phishing report rate"

  - domain: phishing
    measure: count
    caption: "Campaign events"

# --- Security Domains ---
domains:
  # ────────────────────────────────────────────
  # Phishing & Email Security
  # ────────────────────────────────────────────
  - key: phishing
    label: "Phishing & Email Security"
    short: "Phishing"
    icon: mail-warning
    description: >-
      Phishing & email-security posture across simulated-campaign outcomes:
      how many recipients clicked, reported, or took no action.

    genie:
      space_id: ""
      embed_url: "${GENIE_PHISHING_EMBED_URL}"
      starters:
        - "What is the phishing click rate this month?"
        - "Which campaigns had the highest click rate?"
        - "Show the report rate by region"

    health:
      score_measures:
        - phishing_report_rate
      highlights:
        - phishing_click_rate
        - phishing_report_rate
        - count

    metric_view:
      name: mv_phishing
      # Synthetic sandbox gold table. The edp_dev target points the metric
      # view's :source_table param at conn_cyberarch.dbo.phishing_detail; this
      # field is the app-side lineage/label + the pipeline's gold-table name.
      source_table: "${CYBER360_CATALOG}.${CYBER360_SCHEMA}.phishing_detail"
      comment: >-
        Phishing & email-security measures over simulated-phishing campaign
        events (click, report, and no-action outcomes).
      dimensions:
        - name: day
          expression: "CAST(eventtimestamp AS DATE)"
          comment: "Event date dimension"
        - name: Region
          expression: "Region"
          comment: "Geographic region of the recipient"
        - name: Campaign Name
          expression: "campaignname"
          comment: "Name of the phishing campaign"
      # Measure MATH is written in PORTABLE SQL (CASE WHEN / NULLIF / standard
      # division) and is IDENTICAL to resources/metricviews/mv_phishing.sql, so
      # the same string evaluates in Spark (the metric view, prod) and DuckDB
      # (the seed provider, local dev). Keep the two in sync.
      measures:
        - name: phishing_click_rate
          label: "Phishing click rate"
          expression: "COUNT(CASE WHEN eventtype = 'Email Click' THEN 1 END) / NULLIF(COUNT(*), 0) * 100"
          comment: "Percentage of phishing emails where the recipient clicked the link."
          format: percent
          percent_digits: 2
          goal: lower
          green: 5
          amber: 10
          caption: "Target: <5%"

        - name: phishing_report_rate
          label: "Phishing report rate"
          expression: "COUNT(CASE WHEN eventtype = 'Reported' THEN 1 END) / NULLIF(COUNT(*), 0) * 100"
          comment: "Percentage of phishing emails reported by the recipient."
          format: percent
          percent_digits: 2
          goal: higher
          green: 15
          amber: 8
          caption: "Target: >15%"

        - name: avg_click_rate
          label: "Average click rate"
          expression: "AVG(CASE WHEN eventtype = 'Email Click' THEN 1.0 ELSE 0.0 END) * 100"
          comment: "Average click rate across all phishing records (1 clicked / 0 not)."
          format: percent
          percent_digits: 2
          goal: lower
          green: 5
          amber: 10
          caption: "Simulation average"

        - name: count
          label: "Campaign events"
          expression: "COUNT(*)"
          comment: "Total number of phishing-campaign event rows."
          format: count
          goal: higher
          caption: "Simulated sends"

    # Config-driven drill-down table. The generic /api/phishing/rows endpoint
    # SELECTs these columns from metric_view.source_table (per-user OBO), applies
    # the chosen filter's WHERE, and orders by order_by. Adding/removing a column
    # or filter is a pure config edit -- no bespoke row model or endpoint.
    detail_table:
      label: "Campaign events"
      order_by: "eventtimestamp DESC"
      page_size: 25
      columns:
        - { field: eventtimestamp, label: "When", format: datetime }
        - { field: useremailaddress, label: "Recipient" }
        - { field: campaignname, label: "Campaign" }
        - { field: eventtype, label: "Outcome" }
        - { field: Region, label: "Region" }
        - { field: templatesubject, label: "Subject" }
      filters:
        - { key: all, label: "All" }
        - { key: clicked, label: "Clicked", where: "eventtype = 'Email Click'" }
        - { key: reported, label: "Reported", where: "eventtype = 'Reported'" }
        - { key: no_action, label: "No action", where: "eventtype = 'No Action'" }
